    <section id="buildRampView" class="panel build-ramp-panel" hidden aria-hidden="true">
      <div class="ramp-board">

        <!-- Pinned control strip: autopilot switch, status, refresh, sound. -->
        <div class="ramp-bar">
          <div class="ramp-bar-title">
            <h2> Build a Ramp </h2>
            <small id="rampAsOf" class="ramp-asof">Loading today&rsquo;s games&hellip;</small>
          </div>
          <div class="ramp-bar-controls">
            <label class="lm-ap-switch" title="Autopilot keeps every enabled league's games set to your share of Pinnacle, on its own">
              <input id="lmApMaster" type="checkbox">
              <span class="lm-ap-slider" aria-hidden="true"></span>
              <span class="ramp-switch-text">Autopilot <span id="lmApMasterLabel">Off</span></span>
            </label>
            <small id="lmApStatus" class="lm-ap-status"></small>
            <button id="rampRefresh" type="button" class="button secondary ramp-refresh">Refresh</button>
            <label class="lm-ap-sound" title="Chime here when a limit is applied">
              <input id="lmApSound" type="checkbox" checked>
              <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M3 9v6c0 1.1.9 2 2 2h4l5 5V4H9c-1.1 0-2 .9-2 2zm13.5 1c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.26 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
            </label>
          </div>
        </div>

        <div id="lmApMessage" class="message" role="status" hidden></div>

        <!-- All of today's games, every league, filled in on load. -->
        <div id="rampBoard" class="ramp-board-leagues" aria-live="polite"></div>

        <!-- The record of what has been set, out of the way until wanted. -->
        <details id="rampLogWrap" class="ramp-log-wrap" open>
          <summary>Recent limit changes</summary>
          <div id="lmApLog" class="lm-ap-log">
            <table>
              <thead>
                <tr><th>When</th><th>League</th><th>Game</th><th>Market</th><th>Pinnacle</th><th>Limit set</th><th></th></tr>
              </thead>
              <tbody>
                <tr>
                  <td>just now</td>
                  <td>MLB</td>
                  <td>Brewers v Reds</td>
                  <td>Money Line</td>
                  <td><span style="font-weight: 800; font-size: 14px; color: #92400e; background: #fed7aa; padding: 4px 10px; border-radius: 5px;">15,000</span></td>
                  <td><span style="font-weight: 800; font-size: 14px; color: #be185d; background: #fce7f3; padding: 4px 10px; border-radius: 5px;">10,500</span></td>
                  <td></td>
                </tr>
              </tbody>
            </table>
          </div>
        </details>

      </div>
    </section>
