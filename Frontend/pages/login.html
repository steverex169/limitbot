  <main id="loginView" class="login-view">
    <form id="loginForm" class="login-card">
      <p class="eyebrow">LIMIT CONTROL BOT</p>
      <h1>Log in</h1>
      <p>Use the same account you use on AccessHigh.</p>
      <label>
        <span>Username</span>
        <input id="username" name="username" autocomplete="username" required maxlength="100" autofocus>
      </label>
      <label>
        <span>Password</span>
        <input id="password" name="password" type="password" autocomplete="current-password" required maxlength="200">
      </label>
      <div id="loginMessage" class="message error" role="alert" hidden></div>
      <button id="loginButton" class="button primary" type="submit">Log in</button>
    </form>
  </main>
