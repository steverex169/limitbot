    <section id="activityLogsView" class="panel schedules-panel activity-logs-panel" hidden aria-hidden="true">
      <div class="panel-head">
        <div>
          <p class="eyebrow">AUTOMATION</p>
          <h2>Recurring schedules</h2>
          <p>Review upcoming ET limit changes or cancel an active schedule.</p>
        </div>
        <div class="filters activity-log-filters">
          <label class="select-field">
            <span>Status</span>
            <select id="scheduleStatusFilter">
              <option value="all" selected>All</option>
              <option value="active">Active</option>
              <option value="cancelled">Cancelled</option>
            </select>
          </label>
          <button id="deleteAllSchedules" type="button" class="danger-button">
            Delete all
          </button>
        </div>
      </div>

      <div class="table-wrap schedules-table-wrap">
        <table class="schedules-table">
          <thead>
            <tr>
              <th>Created (EST)</th>
              <th>Agent</th>
              <th>CS Agent</th>
              <th>League</th>
              <th>Period</th>
              <th>Spread</th>
              <th>Money line</th>
              <th>Total</th>
              <th class="col-team-total">Team total</th>
              <th>Repeats</th>
              <th>Next run (EST)</th>
              <th>Last run (EST)</th>
              <th>Status</th>
              <th>Detail</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="scheduleRows">
            <tr>
            <td colspan="15" class="empty-state">No scheduled limits.</td>
          </tr>
        </tbody>
      </table>
      </div>
    </section>
