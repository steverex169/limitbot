  <header id="dashboardHeader" class="topbar" hidden>
    <div class="topbar-actions">
      <div class="topbar-title">
        <p class="eyebrow">AUTHORIZED TESTING DASHBOARD</p>
        <h1>Limit Control Bot</h1>
      </div>
      <button id="themeToggle" class="theme-toggle" type="button" aria-label="Switch theme" aria-pressed="false">
        <span class="theme-toggle-icon theme-toggle-sun" aria-hidden="true">☀</span>
        <span class="theme-toggle-icon theme-toggle-moon" aria-hidden="true">☾</span>
      </button>
      <div class="account-chip">
        <span class="status-dot"></span>
        <div>
          <strong id="accountName">Loading…</strong>
          <small id="accountId">Account</small>
        </div>
      </div>
      <button id="logoutButton" class="button secondary logout-button" type="button">Log out</button>
    </div>
  </header>
